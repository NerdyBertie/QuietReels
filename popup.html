<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="ready" hidden>
    <p class="site" id="site"></p>
    <div class="readout"><span id="pct">10</span><span class="sign">%</span></div>
    <input type="range" id="slider" min="0" max="100" step="1" value="10" aria-label="Video volume">
    <div class="presets">
      <button data-v="5">5%</button>
      <button data-v="10">10%</button>
      <button data-v="25">25%</button>
      <button data-v="50">50%</button>
    </div>
    <p class="note">Saved automatically. This is the loudest videos can get here: the site's own slider at 100% plays at this level.</p>
  </main>
  <main id="unsupported" hidden>
    <p class="site">Quiet Reels</p>
    <p class="note">Open Facebook or Instagram, then click this icon to set the volume.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
